<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>その発言で会話がピタッと止まった - マイク参加</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'M PLUS Rounded 1c', 'Zen Maru Gothic', sans-serif;
    }
    .comic-box {
      border: 4px solid #000;
      box-shadow: 5px 5px 0px #000;
    }
    @keyframes pulse-ring {
      0% { transform: scale(1); }
      50% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }
    .animate-pulse-ring {
      animation: pulse-ring 0.8s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-amber-50 text-slate-900 min-h-screen flex flex-col items-center justify-center p-4 select-none">
  
  <div class="max-w-md w-full bg-white border-4 border-black rounded-3xl p-6 comic-box space-y-5">
    
    <!-- ヘッダー -->
    <div class="text-center space-y-2">
      <div class="inline-block bg-red-600 text-white font-black text-xs px-3 py-1 rounded-md rotate-[-2deg] border-2 border-black shadow-sm">
        発言監視デバイス
      </div>
      <h1 class="text-2xl font-black tracking-tight text-slate-900 leading-tight">
        その発言で！ピタッと止まった
      </h1>
      <p class="text-xs font-bold text-slate-600">※音声内容は一切送信されず、発話判定のみ持ち寄られます</p>
    </div>

    <!-- 入室フォーム (未開始時) -->
    <div id="joinSection" class="space-y-4">
      <div class="space-y-1">
        <label class="block text-xs font-black text-slate-700">あなたのニックネーム</label>
        <input id="userNameInput" type="text" placeholder="例: 審査員A / 田中" class="w-full px-4 py-3 bg-amber-50 border-3 border-black rounded-2xl text-slate-900 font-black focus:outline-none focus:bg-white text-base">
      </div>
      
      <button id="startBtn" class="w-full py-4 bg-red-500 hover:bg-red-600 active:translate-x-1 active:translate-y-1 text-white font-black text-lg rounded-2xl border-3 border-black shadow-[4px_4px_0px_#000] transition-all">
        マイク接続して監視開始！
      </button>

      <div class="flex justify-center pt-2">
        <img src="./その発言で会話がピタッと止まった.png" alt="その発言で会話がピタッと止まった" class="w-48 rounded-2xl border-3 border-black shadow-md">
      </div>
    </div>

    <!-- アクティブマイク画面 (参加後) -->
    <div id="activeSection" class="hidden space-y-5">
      
      <!-- ステータスバッジ -->
      <div class="flex items-center justify-between bg-amber-100 p-3 rounded-2xl border-2 border-black">
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 rounded-full bg-red-500 animate-ping"></span>
          <span id="displayName" class="font-black text-sm text-slate-900"></span>
        </div>
        <span class="text-xs px-2.5 py-1 bg-red-600 text-white rounded-lg font-black border border-black shadow-sm">監視中</span>
      </div>

      <!-- 発話ビジュアライザー -->
      <div class="flex flex-col items-center justify-center p-6 bg-amber-50 rounded-2xl border-3 border-black space-y-3">
        <div id="speakingRing" class="relative flex items-center justify-center w-28 h-28 rounded-full border-4 border-slate-400 bg-white transition-all duration-150 shadow-inner">
          <span id="micLabel" class="text-base font-black text-slate-500">待機中</span>
        </div>
        <div id="speakingText" class="text-base font-black text-slate-700">沈黙中（安全）...</div>
        
        <!-- 音量メーター -->
        <div class="w-full space-y-1">
          <div class="flex justify-between text-[11px] font-bold text-slate-600">
            <span>マイク音量</span>
            <span id="levelValue">0.00</span>
          </div>
          <div class="w-full h-3 bg-slate-200 border-2 border-black rounded-full overflow-hidden">
            <div id="levelBar" class="h-full bg-red-500 w-0 transition-all duration-75"></div>
          </div>
        </div>
      </div>

      <!-- 感度調整スライダー (会場騒音対策) -->
      <div class="bg-white p-3 rounded-2xl border-2 border-black space-y-1">
        <div class="flex justify-between text-xs font-black text-slate-800">
          <span>感度マージン（騒音対策）</span>
          <span id="sensitivityVal" class="text-red-600 font-mono">0.05</span>
        </div>
        <input id="sensitivitySlider" type="range" min="0.01" max="0.30" step="0.01" value="0.05" class="w-full accent-red-500 cursor-pointer">
        <p class="text-[10px] font-bold text-slate-500">※周りがうるさいときは右に動かしてください</p>
      </div>

      <!-- スリープ防止案内 -->
      <div class="p-2.5 bg-yellow-100 border-2 border-black rounded-xl text-[11px] font-bold text-slate-800 flex items-center gap-2">
        <span>注意: 監視を継続するため、この画面を開いたまま会話をお楽しみください。</span>
      </div>

      <!-- 切断ボタン -->
      <button id="leaveBtn" class="w-full py-2 text-xs font-bold text-slate-500 hover:text-red-600 transition-colors">
        切断して退出
      </button>
    </div>

  </div>

  <script>
    let ws = null;
    let audioContext = null;
    let micStream = null;
    let vadNode = null;
    let userId = 'u_' + Math.random().toString(36).substring(2, 9);
    let userName = '';
    
    let isSpeaking = false;
    let currentLevel = 0;
    let noiseFloor = 0.02;
    let sensitivityMargin = 0.05;

    const joinSection = document.getElementById('joinSection');
    const activeSection = document.getElementById('activeSection');
    const userNameInput = document.getElementById('userNameInput');
    const startBtn = document.getElementById('startBtn');
    const displayName = document.getElementById('displayName');
    const speakingRing = document.getElementById('speakingRing');
    const micLabel = document.getElementById('micLabel');
    const speakingText = document.getElementById('speakingText');
    const levelBar = document.getElementById('levelBar');
    const levelValue = document.getElementById('levelValue');
    const sensitivitySlider = document.getElementById('sensitivitySlider');
    const sensitivityVal = document.getElementById('sensitivityVal');
    const leaveBtn = document.getElementById('leaveBtn');

    sensitivitySlider.addEventListener('input', (e) => {
      sensitivityMargin = parseFloat(e.target.value);
      sensitivityVal.textContent = sensitivityMargin.toFixed(2);
    });

    startBtn.addEventListener('click', async () => {
      userName = userNameInput.value.trim() || '参加者_' + userId.slice(-3);
      try {
        await initAudio();
        initWebSocket();
        displayName.textContent = userName;
        joinSection.classList.add('hidden');
        activeSection.classList.remove('hidden');
      } catch (err) {
        alert('マイクの初期化に失敗しました: ' + err.message);
      }
    });

    leaveBtn.addEventListener('click', () => {
      location.reload();
    });

    async function initAudio() {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      if (audioContext.state === 'suspended') {
        await audioContext.resume();
      }

      micStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: false,
          autoGainControl: true
        }
      });

      const source = audioContext.createMediaStreamSource(micStream);

      const highpass = audioContext.createBiquadFilter();
      highpass.type = 'highpass';
      highpass.frequency.value = 300;

      const lowpass = audioContext.createBiquadFilter();
      lowpass.type = 'lowpass';
      lowpass.frequency.value = 3400;

      await audioContext.audioWorklet.addModule('/audio-worklet-vad.js');
      vadNode = new AudioWorkletNode(audioContext, 'vad-processor');

      vadNode.port.onmessage = (event) => {
        const rms = event.data.rms;
        currentLevel = rms;

        noiseFloor = noiseFloor * 0.95 + Math.min(noiseFloor, rms) * 0.05;
        const threshold = noiseFloor + sensitivityMargin;

        if (!isSpeaking && rms > threshold * 1.3) {
          isSpeaking = true;
        } else if (isSpeaking && rms < threshold * 0.9) {
          isSpeaking = false;
        }

        updateUI();
      };

      source.connect(highpass);
      highpass.connect(lowpass);
      lowpass.connect(vadNode);
    }

    function initWebSocket() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${location.host}/ws`);

      ws.onopen = () => {
        setInterval(() => {
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({
              type: 'voice_state',
              userId,
              userName,
              speaking: isSpeaking,
              level: Math.round(currentLevel * 100) / 100
            }));
          }
        }, 100);
      };
    }

    function updateUI() {
      levelValue.textContent = currentLevel.toFixed(3);
      levelBar.style.width = `${Math.min(100, currentLevel * 400)}%`;

      if (isSpeaking) {
        speakingRing.className = 'relative flex items-center justify-center w-28 h-28 rounded-full border-4 border-red-600 bg-red-100 shadow-md animate-pulse-ring transition-all duration-150';
        micLabel.className = 'text-base font-black text-red-600';
        micLabel.textContent = '発言中';
        speakingText.className = 'text-base font-black text-red-600';
        speakingText.textContent = 'あなたが発言中！（監視対象）';
      } else {
        speakingRing.className = 'relative flex items-center justify-center w-28 h-28 rounded-full border-4 border-slate-400 bg-white transition-all duration-150';
        micLabel.className = 'text-base font-black text-slate-500';
        micLabel.textContent = '待機中';
        speakingText.className = 'text-base font-black text-slate-700';
        speakingText.textContent = '沈黙中（安全）...';
      }
    }
  </script>
</body>
</html>
