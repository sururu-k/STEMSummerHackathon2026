name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Marp Slide Build
        run: npm run build-slides

      - name: Check Static Assets Integrity
        run: |
          test -f "public/display.html"
          test -f "public/index.html"
          test -f "public/studio.html"
          test -f "public/その発言で会話がピタッと止まった.png"
